name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release-binaries:
    name: Build Release Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: needlefish-linux-x86_64
            cmake_flags: -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"
          - os: macos-latest
            artifact_name: needlefish-macos-universal
            cmake_flags: "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Ninja on macOS
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure CMake
        run: cmake -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_LTO=ON -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_FUZZERS=OFF ${{ matrix.cmake_flags }}
      - name: Build
        run: cmake --build build/release --target needlefish
      - name: Package Binary
        run: |
          mkdir -p dist
          cp build/release/bin/needlefish* dist/
          tar -czf dist/${{ matrix.artifact_name }}.tar.gz -C dist needlefish*
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.tar.gz
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.artifact_name }}.tar.gz

  publish-ghcr:
    name: Build and Push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set lower case owner name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}:${{ github.ref_name }}
