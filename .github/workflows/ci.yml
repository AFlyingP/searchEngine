name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check Formatting
        run: |
          find src include tests cli bench fuzz -name '*.cpp' -o -name '*.hpp' | xargs clang-format --dry-run --Werror

  tidy:
    name: Clang-Tidy Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-tidy clang llvm
      - name: Configure CMake
        run: |
          cmake -B build/tidy -G Ninja \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER=clang \
            -DBUILD_TESTS=ON
      - name: Run Clang-Tidy
        run: |
          run-clang-tidy -p build/tidy src/

  build-test:
    name: Build & Test (${{ matrix.compiler }}, ${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [debug, release, sanitize, tsan]
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang llvm
      - name: Configure CMake
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            cmake --preset ${{ matrix.preset }} \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++
          else
            cmake --preset ${{ matrix.preset }} \
              -DCMAKE_C_COMPILER=gcc \
              -DCMAKE_CXX_COMPILER=g++
          fi
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Run Tests
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  fuzz:
    name: Fuzz Testing (Clang libFuzzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang llvm
      - name: Configure CMake with Fuzzing
        run: |
          cmake -B build/fuzz -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DENABLE_LIBFUZZER=ON \
            -DBUILD_FUZZERS=ON
      - name: Build Fuzzers
        run: cmake --build build/fuzz
      - name: Run Fuzz Smoke Test
        run: |
          ./build/fuzz/bin/fuzz_regex -max_total_time=10

  coverage:
    name: Code Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang llvm lcov
      - name: Configure & Build with Coverage
        run: |
          cmake -B build/coverage -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DENABLE_COVERAGE=ON
          cmake --build build/coverage
      - name: Run Test Suite
        run: ctest --test-dir build/coverage --output-on-failure
      - name: Generate and Validate Coverage Report
        run: |
          llvm-profdata merge -sparse default.profraw -o coverage.profdata
          llvm-cov show ./build/coverage/bin/test_needlefish_unit \
            -instr-profile=coverage.profdata \
            -ignore-filename-regex='(tests/|_deps/)' \
            -format=text > coverage.txt
          cat coverage.txt
          llvm-cov report ./build/coverage/bin/test_needlefish_unit \
            -instr-profile=coverage.profdata \
            -ignore-filename-regex='(tests/|_deps/)'
