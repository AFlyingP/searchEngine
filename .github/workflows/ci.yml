name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check Formatting
        run: |
          find src tests cli bench -name '*.cpp' -o -name '*.hpp' | xargs clang-format --dry-run --Werror

  build-test:
    name: Build & Test (${{ matrix.compiler }}, ${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [debug, release, sanitize]
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            sudo apt-get install -y g++-14
            echo "CC=gcc-14" >> $GITHUB_ENV
            echo "CXX=g++-14" >> $GITHUB_ENV
          else
            sudo apt-get install -y clang-18 llvm-18 lld-18
            echo "CC=clang-18" >> $GITHUB_ENV
            echo "CXX=clang++-18" >> $GITHUB_ENV
          fi
      - name: Configure CMake
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            cmake --preset ${{ matrix.preset }} \
              -DCMAKE_C_COMPILER=clang-18 \
              -DCMAKE_CXX_COMPILER=clang++-18 \
              -DCMAKE_AR=llvm-ar-18 \
              -DCMAKE_RANLIB=llvm-ranlib-18
          else
            cmake --preset ${{ matrix.preset }} \
              -DCMAKE_C_COMPILER=gcc-14 \
              -DCMAKE_CXX_COMPILER=g++-14
          fi
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Run Tests
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 llvm-18
      - name: Configure & Build with Coverage
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -B build/coverage -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DENABLE_COVERAGE=ON
          cmake --build build/coverage
      - name: Run Test Suite
        run: ctest --test-dir build/coverage --output-on-failure
      - name: Generate Coverage Report
        run: |
          llvm-profdata-18 merge -sparse default.profraw -o coverage.profdata || true
          llvm-cov-18 show ./build/coverage/tests/test_needlefish_unit \
            -instr-profile=coverage.profdata \
            -ignore-filename-regex='(tests/|_deps/)' \
            -format=text > coverage.txt || true
          cat coverage.txt || true
